[workspace]
resolver = "2"
members = [
    "crates/overlay-shim",
    "crates/nucleon-core",
    "crates/nucleon-runner",
    "crates/nucleon-hook",
    "crates/nucleon-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive", "cargo"] }
ctor = "0.2"
libc = "0.2"
object = "0.36"
memchr = "2.7"
regex = "1.10"
tempfile = "3.10"
sha2 = "0.10"
hex = "0.4"
core-graphics = "0.23"
core-foundation = "0.9"
frida-gum = { version = "0.17", default-features = false, features = ["auto-download"] }
frida-gum-sys = { version = "0.17", default-features = false }

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
