object = { workspace = true }
memchr = { workspace = true }
aho-corasick = "1.1.5"
plist = { workspace = true }
steam-vdf-parser = "0.1.2"
ureq = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
