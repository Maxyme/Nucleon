[package]
name = "nucleon-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1.20"
toml = "1.1.8"
include_dir = "0.7.4"
manifest-dir-macros = "0.1.20"
static-toml = "1.3.0"
sha2 = "0.11.1"
