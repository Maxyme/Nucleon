[workspace]
resolver = "2"
members = [
    "crates/dobby-sys",
    "crates/overlay-shim",
    "crates/nucleon-core",
    "crates/nucleon-runner",
    "crates/nucleon-hook",
    "crates/nucleon-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive", "cargo"] }
ctor = "0.2"
libc = "0.2"
object = "0.36"
memchr = "2.7"
regex = "1.10"
tempfile = "3.10"
sha2 = "0.10"
hex = "0.4"
core-graphics = "0.23"
core-foundation = "0.9"
