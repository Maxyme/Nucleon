[workspace]
resolver = "2"
members = [
    "crates/nucleon-core",
    "crates/nucleon-runner",
    "crates/nucleon-cli",
    "crates/nucleon-devtools",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"
env_logger = "0.11.11"
clap = { version = "4.6.7", features = ["derive", "cargo"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
rustix = { version = "1.1.6", features = ["process"] }
libc = "0.2.191"
object = "0.40.0"
memchr = "2.8.3"
tempfile = "3.27.0"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
plist = "1.10.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
zstd = "0.14.3"
hex = "0.4.3"

[workspace.lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
wildcard_imports = "warn"
single_component_path_imports = "warn"
