name: Isotope release integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published Isotope version (for example 0.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  import:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ISOTOPE_VERSION: ${{ inputs.version }}
      NUCLEON_SUPPORT_DIR: ${{ runner.temp }}/isotope-consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Build the consumer
        run: |
          test "$(uname -m)" = arm64
          cargo build --release --locked -p nucleon-cli
      - name: Import and verify the published runtime
        run: |
          target/release/nucleon wine install isotope --version "$ISOTOPE_VERSION"
          receipts=("$NUCLEON_SUPPORT_DIR"/runtimes/arm64-fex/*/.nucleon-install.json)
          test "${#receipts[@]}" = 1
          test -f "${receipts[0]}"
          runtime_root="$(dirname "${receipts[0]}")"
          target/release/nucleon wine fex verify "$runtime_root"
          target/release/nucleon wine inspect "$runtime_root" --json > "$RUNNER_TEMP/isotope-inspection.json"
          target/release/nucleon wine fex select "$runtime_root"
          target/release/nucleon wine fex verify
      - name: Build the owned Windows workload
        run: |
          brew install mingw-w64
          x86_64-w64-mingw32-gcc -O2 -municode \
            crates/nucleon-cli/tests/fixtures/standalone.c \
            -o "$RUNNER_TEMP/isotope-consumer-probe.exe"
      - name: Launch the workload through the selected Isotope runtime
        env:
          NUCLEON_RUN_SECONDS: '20'
          NUCLEON_RUN_RECEIPT: ${{ runner.temp }}/isotope-launch.json
          SteamAppId: synthetic-parent
          STEAM_COMPAT_DATA_PATH: synthetic-parent
        run: |
          target/release/nucleon run "$RUNNER_TEMP/isotope-consumer-probe.exe" \
            --emulator fex --engine wine -- consumer-probe
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ['RUNNER_TEMP'])
          inspection = json.loads((work / 'isotope-inspection.json').read_text())
          receipt = json.loads((work / 'isotope-launch.json').read_text())
          assert receipt['status'] == 'exited' and receipt['exit_code'] == 0, receipt['status']
          assert receipt['origin'] == 'standalone'
          assert receipt['execution_mode'] == 'Arm64Fex'
          assert receipt['runtime'] == inspection['runtime']['root']
          assert Path(receipt['prefix']).is_relative_to(Path(os.environ['NUCLEON_SUPPORT_DIR']))
          output = Path(receipt['wine_log']).read_text(errors='replace')
          for marker in ('ARG[1]=<consumer-probe>', 'STEAM_ID=unset', 'STEAM_DATA=unset', 'STEAM_REDIRECT=unset'):
              assert marker in output, marker
          PY
      - name: Retain consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isotope-consumer-validation
          path: |
            ${{ runner.temp }}/isotope-inspection.json
            ${{ runner.temp }}/isotope-launch.json
            ${{ runner.temp }}/isotope-consumer/logs/
            ${{ runner.temp }}/isotope-consumer/runtimes/arm64-fex/*/.nucleon-install.json
          include-hidden-files: true
          if-no-files-found: warn
